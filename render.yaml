services:
  - type: web
    name: coup-royale-server
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGINS
        sync: false
      - key: DATA_DIR
        value: /tmp/coup-royale
